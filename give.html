<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donate | Abdul Kasmu Islamic Charity Organization</title>
<style>
:root{--bg:#fbf8f1;--card:#fff;--t:#1f2a24;--m:#5d6b63;--a:#1f6b4a;--l:#e4ddcc}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1b2620;--t:#eef2ee;--m:#a3b2a8;--a:#4fbf8b;--l:#2b3a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.5 system-ui,sans-serif;padding:20px}
.w{max-width:520px;margin:0 auto}
h1{font-size:24px;margin:6px 0}
h2{font-size:18px;margin:22px 0 8px}
p{color:var(--m);margin:6px 0}
.chips,.tabs{display:flex;flex-wrap:wrap;gap:8px}
.chip,.tab{background:var(--card);color:var(--t);border:2px solid var(--l);border-radius:999px;padding:10px 16px;font:600 16px system-ui,sans-serif}
.on{background:var(--a);border-color:var(--a);color:#fff}
input{width:100%;margin-top:10px;padding:12px;border:2px solid var(--l);border-radius:12px;background:var(--card);color:var(--t);font-size:17px}
.box{background:var(--card);border:2px solid var(--a);border-radius:16px;padding:14px 16px;margin:14px 0}
.box h3{margin:0 0 6px;font-size:19px;color:var(--a)}
.r{padding:10px 0;border-bottom:1px solid var(--l)}
.r:last-of-type{border:0}
.r span{color:var(--m);font-size:14px;display:block}
.r b{font-size:20px;word-break:break-all}
.go{display:block;text-align:center;background:var(--a);color:#fff;border-radius:999px;padding:15px;font:600 17px system-ui,sans-serif;text-decoration:none;margin-top:16px}
.sum{background:var(--card);border:1px solid var(--l);border-radius:12px;padding:12px 16px;margin:12px 0}
</style></head><body><div class="w">
<h1>Donate</h1>
<p>Abdul Kasmu Islamic Charity Organization, Bubulo, Mbale, Uganda</p>
<h2>1. Choose an amount</h2>
<div class="chips" id="chips"></div>
<input id="amt" type="number" inputmode="decimal" placeholder="Or type your own amount in euros">
<h2>2. Choose how to send</h2>
<div class="tabs" id="tabs"></div>
<div class="box" id="details"></div>
<h2>3. After you pay</h2>
<div class="sum" id="sum"></div>
<a class="go" id="wa" href="#">Send my receipt on WhatsApp</a>
<p style="text-align:center;margin-top:16px"><a href="/" style="color:var(--a)">Back to our website</a></p>
</div>
<script>
var amounts=[1,10,30,60,160,350],amount=10,method='wu';
var data={
wu:{name:'Western Union',title:'Send money by Western Union to this person in Uganda',rows:[['Receiver first name','Kenneth'],['Receiver last name','Nakisisa'],['Country','Uganda'],['City','Mbale']],note:'Ria and MoneyGram work the same way.'},
bank:{name:'bank transfer',title:'Send money to this bank account',rows:[['Bank','Equity Bank'],['Account name','Kenneth Nakisisa'],['Account number','1014103747435'],['SWIFT code','EQBLUGKA']],note:'Check the account name before you pay.'},
mm:{name:'mobile money',title:'Send money to this mobile money number',rows:[['Number','+256 750 134 236'],['Name','Nakisisa Kenneth']],note:'Only if your app can send to Uganda mobile money.'}
};
var hs=location.hash.replace('#','');
if(data[hs])method=hs;
function msg(){return 'Assalamu alaikum, I have donated \u20ac'+amount+' by '+data[method].name+'. My name for the banner is: '}
function upd(){
var d=data[method];
document.getElementById('sum').innerHTML='You are sending <b>\u20ac'+amount+'</b> by <b>'+d.name+'</b>. After paying, send us a screenshot of the receipt, your name for our banner, and what your gift is for.';
document.getElementById('wa').href='https://wa.me/256741344006?text='+encodeURIComponent(msg());
}
function draw(){
var ch=document.getElementById('chips');ch.innerHTML='';
amounts.forEach(function(a){var b=document.createElement('button');b.className='chip'+(a===amount?' on':'');b.textContent='\u20ac'+a;b.onclick=function(){amount=a;document.getElementById('amt').value='';draw()};ch.appendChild(b)});
var tb=document.getElementById('tabs');tb.innerHTML='';
var labels={wu:'Western Union',bank:'Bank',mm:'Mobile money'};
Object.keys(data).forEach(function(k){var b=document.createElement('button');b.className='tab'+(k===method?' on':'');b.textContent=labels[k];b.onclick=function(){method=k;draw()};tb.appendChild(b)});
var d=data[method],h='<h3>'+d.title+'</h3>';
d.rows.forEach(function(r){h+='<div class="r"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'});
h+='<p>'+d.note+'</p>';
document.getElementById('details').innerHTML=h;
upd();
}
document.getElementById('amt').oninput=function(){var v=parseFloat(this.value);if(v>0){amount=v;upd();document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')})}};
draw();
</script></body></html>
