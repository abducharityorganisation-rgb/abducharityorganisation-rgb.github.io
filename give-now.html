<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donate | Abdul Kasmu Islamic Charity Organization</title>
<style>
:root{--bg:#f4f1e8;--card:#fff;--t:#17231c;--m:#55645b;--a:#1f6b4a;--d:#124a32;--g:#c99a2e;--l:#ddd5bf}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#1a251f;--t:#f0f4f0;--m:#a8b8ae;--a:#3fae7a;--d:#16402c;--g:#e0b45a;--l:#2b3a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:18px/1.5 system-ui,sans-serif}
.top{background:var(--d);color:#fff;text-align:center;padding:30px 20px 34px}
.top small{display:block;color:#e8d9a8;font-size:15px;letter-spacing:.5px}
.top h1{font-size:40px;margin:6px 0}
.top p{margin:0;font-size:19px;color:#e9f2ec}
.w{max-width:560px;margin:0 auto;padding:20px}
h2{font-size:22px;margin:26px 0 12px}
h2 span{display:inline-block;background:var(--a);color:#fff;width:32px;height:32px;border-radius:50%;text-align:center;line-height:32px;font-size:18px;margin-right:8px}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.amt{background:var(--card);color:var(--t);border:3px solid var(--l);border-radius:16px;padding:16px 0;font:700 22px system-ui,sans-serif}
.on{background:var(--a)!important;border-color:var(--a)!important;color:#fff!important}
input{width:100%;margin-top:12px;padding:15px;border:3px solid var(--l);border-radius:16px;background:var(--card);color:var(--t);font-size:19px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);color:var(--t);border:3px solid var(--l);border-radius:20px;padding:18px 8px;text-align:center;font:700 18px system-ui,sans-serif}
.opt i{display:block;font-style:normal;font-size:44px;line-height:1.2}
.opt small{display:block;font-weight:400;font-size:14px;color:var(--m)}
.opt.on small{color:#e9f2ec}
.panel{background:var(--card);border:4px solid var(--a);border-radius:22px;padding:20px;margin-top:18px}
.panel h3{margin:0 0 14px;font-size:24px;color:var(--a);line-height:1.25}
.f{background:var(--bg);border-radius:14px;padding:12px 16px;margin:10px 0}
.f span{display:block;color:var(--m);font-size:15px}
.f b{display:block;font-size:26px;word-break:break-all}
.panel ol{padding-left:24px;margin:16px 0 0}
.panel li{margin:8px 0;font-size:18px}
.note{background:#fff6dc;color:#5b4710;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:16px}
.sum{background:var(--card);border-left:6px solid var(--g);border-radius:12px;padding:14px 16px;font-size:19px}
.go{display:block;text-align:center;background:#25a05a;color:#fff;border-radius:999px;padding:20px;font:700 21px system-ui,sans-serif;text-decoration:none;margin-top:16px}
.back{text-align:center;margin:20px 0}
.back a{color:var(--a);font-size:17px}
</style></head><body>
<div class="top"><small>ABDUL KASMU ISLAMIC CHARITY ORGANIZATION</small><h1>Donate</h1><p>Your gift reaches families in Uganda</p></div>
<div class="w">
<h2><span>1</span>Choose an amount</h2>
<div class="amts" id="amts"></div>
<input id="amt" type="number" inputmode="decimal" placeholder="Or type your own amount (euros)">
<h2><span>2</span>Choose how to send</h2>
<div class="opts" id="opts"></div>
<div class="panel" id="panel"></div>
<h2><span>3</span>After you pay</h2>
<div class="sum" id="sum"></div>
<a class="go" id="wa" href="#">Send my receipt on WhatsApp</a>
<div class="back"><a href="/">Back to our website</a></div>
</div>
<script>
var amounts=[1,10,30,60,160,350],amount=10,method='card';
var qs=new URLSearchParams(location.search),q=parseFloat(qs.get('amt')),cause=(qs.get('for')||'').replace(/[<>&"]/g,'').slice(0,40);
if(q>0)amount=q;
var wu=[['Receiver first name','Kenneth'],['Receiver last name','Nakisisa'],['Country','Uganda'],['City','Mbale']];
var data={
card:{icon:'\ud83d\udcb3',label:'Card / Google Pay',sub:'Mastercard, Visa',name:'card or Google Pay (in a money transfer app)',title:'Pay with your card or Google Pay',rows:wu,steps:['Open the Western Union, Ria or MoneyGram app.','Choose Send money to Uganda.','Type the receiver details shown above.','Pay with Mastercard, Visa or Google Pay, if the app offers it.'],note:'Our website does not take card numbers. You pay safely inside the money transfer app.'},
wu:{icon:'\ud83c\udf0d',label:'Western Union',sub:'Ria, MoneyGram too',name:'Western Union',title:'Send money by Western Union to this person in Uganda',rows:wu,steps:['Open the Western Union app, or go to an agent.','Choose Uganda.','Type the receiver details shown above.','Pay, and keep your receipt.']},
bank:{icon:'\ud83c\udfe6',label:'Bank transfer',sub:'Equity Bank',name:'bank transfer',title:'Send money to this bank account',rows:[['Bank','Equity Bank'],['Account name','Kenneth Nakisisa'],['Account number','1014103747435'],['SWIFT code','EQBLUGKA']],steps:['Open your bank app.','Choose international transfer.','Type the bank details shown above.','Check the account name, then pay.']},
mm:{icon:'\ud83d\udcf1',label:'Mobile money',sub:'Uganda number',name:'mobile money',title:'Send money to this mobile money number',rows:[['Number','+256 750 134 236'],['Name','Nakisisa Kenneth']],steps:['Open your money app.','Choose Uganda mobile money.','Type the number and name shown above.','Check the name, then pay.'],note:'Only if your app can send to Uganda mobile money.'}
};
var hs=location.hash.replace('#','');
if(data[hs])method=hs;
function upd(){
var d=data[method],c=cause?' for <b>'+cause+'</b>':'';
document.getElementById('sum').innerHTML='You are sending <b>\u20ac'+amount+'</b> by <b>'+d.name+'</b>'+c+'.<br>Send us the receipt screenshot, your name for our banner, and what your gift is for.';
document.getElementById('wa').href='https://wa.me/256741344006?text='+encodeURIComponent('Assalamu alaikum, I have donated \u20ac'+amount+' by '+d.name+(cause?' for '+cause:'')+'. My name for the banner is: ');
}
function draw(){
var a=document.getElementById('amts');a.innerHTML='';
amounts.forEach(function(v){var b=document.createElement('button');b.className='amt'+(v===amount?' on':'');b.textContent='\u20ac'+v;b.onclick=function(){amount=v;document.getElementById('amt').value='';draw()};a.appendChild(b)});
var o=document.getElementById('opts');o.innerHTML='';
Object.keys(data).forEach(function(k){var d=data[k],b=document.createElement('button');b.className='opt'+(k===method?' on':'');b.innerHTML='<i>'+d.icon+'</i>'+d.label+'<small>'+d.sub+'</small>';b.onclick=function(){method=k;draw();document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'})};o.appendChild(b)});
var d=data[method],h='<h3>'+d.title+'</h3>';
d.rows.forEach(function(r){h+='<div class="f"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>'});
h+='<ol>';d.steps.forEach(function(s){h+='<li>'+s+'</li>'});h+='</ol>';
if(d.note)h+='<div class="note">'+d.note+'</div>';
document.getElementById('panel').innerHTML=h;
upd();
}
document.getElementById('amt').oninput=function(){var v=parseFloat(this.value);if(v>0){amount=v;upd();document.querySelectorAll('.amt').forEach(function(c){c.classList.remove('on')})}};
draw();
if(amounts.indexOf(amount)<0)document.getElementById('amt').value=amount;
</script></body></html>
